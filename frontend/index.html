<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>HopeSphere | Connect, Volunteer & Empower Communities</title>
    <meta
      name="title"
      content="HopeSphere | Connect, Volunteer & Empower Communities"
    />
    <meta
      name="description"
      content="HopeSphere connects passionate volunteers, generous donors, and verified nonprofit organizations to create lasting social impact through food relief, child education, and healthcare outreach."
    />
    <meta
      name="keywords"
      content="HopeSphere, nonprofit, charity, volunteer, donate, social impact, NGO, community service, education, healthcare, nutrition"
    />
    <meta name="author" content="HopeSphere Foundation" />
    <meta name="theme-color" content="#0F2B48" />

    <!-- Google Fonts: Inter & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HopeSphere – Together, We Can Make a Lasting Difference" />
    <meta
      property="og:description"
      content="Discover trusted causes, connect with nonprofit organizations, volunteer your time, and help create meaningful change in communities that need it most."
    />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="HopeSphere – Together, We Can Make a Lasting Difference" />
    <meta
      property="twitter:description"
      content="Discover trusted causes, connect with nonprofit organizations, volunteer your time, and help create meaningful change."
    />
    <meta property="twitter:image" content="/logo.svg" />
  </head>

  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
